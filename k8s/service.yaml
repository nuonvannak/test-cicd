apiVersion: v1
kind: Service
metadata:
  name: test-cicd-service
  labels:
    app: test-cicd-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: test-cicd-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-cicd-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-cicd-service
            port:
              number: 80
